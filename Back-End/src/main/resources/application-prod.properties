spring.application.name=Car-Rental

# Allow circular references
spring.main.allow-circular-references=true

# Database Configuration (Railway MySQL)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}
jwt.expiration=3600000

# Server Configuration
server.port=${PORT:8080}
app.base-url=${APP_BASE_URL:https://your-app.railway.app}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Bank QR Configuration
bank.bank-id=${BANK_ID:MB}
bank.bank-name=${BANK_NAME:MB Bank}
bank.account-number=${BANK_ACCOUNT:0354984257}
bank.account-name=${BANK_ACCOUNT_NAME:NGUYEN TAN DAT}
bank.qr-expiration-minutes=30
bank.qr-image-path=/storage/image/QRcode.png
