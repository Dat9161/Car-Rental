spring.application.name=Car-Rental

# Allow circular references (temporary fix)
spring.main.allow-circular-references=true

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/car-rental
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
# Tự động tạo/cập nhật bảng khi chạy ứng dụng (dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Configuration
jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration=3600000

# Server Configuration
server.port=8080
# Base URL for images (change this to your actual server URL in production)
app.base-url=http://localhost:8080

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================
# Bank QR Payment Configuration
# =====================================================
# Danh sách mã ngân hàng phổ biến:
# MB (MB Bank), VCB (Vietcombank), TCB (Techcombank), ACB (ACB)
# BIDV (BIDV), VPB (VPBank), TPB (TPBank), STB (Sacombank)
# =====================================================
bank.bank-id=MB
bank.bank-name=MB Bank
bank.account-number=0354984257
bank.account-name=NGUYEN TAN DAT
bank.qr-expiration-minutes=30
bank.qr-image-path=/storage/image/QRcode.png
